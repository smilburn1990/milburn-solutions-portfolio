version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Nuxt 4 needs Node 20.19+; pin it rather than inherit the image default.
        - nvm install $(cat .nvmrc)
        - nvm use $(cat .nvmrc)
        # npm 10.8 writes a lockfile its own `ci` then rejects as out of sync.
        # Pin npm too, so the install is reproducible rather than image-dependent.
        - npm install -g npm@11
        - node -v && npm -v
        - npm ci --no-audit --no-fund
    build:
      commands:
        # Static generate: both routes are prerendered to real HTML, so there is
        # no Lambda to cold-start and crawlers get fully rendered pages.
        - npm run generate
  artifacts:
    baseDirectory: .output/public
    files:
      - '**/*'
  cache:
    paths:
      # Nuxt's build cache lives at node_modules/.cache/nuxt, not .nuxt/
      - node_modules/**/*
